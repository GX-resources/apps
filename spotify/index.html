<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<iframe id="f" title="iFrame" allow="fullscreen" scrolling="no" frameborder="no"></iframe>
<script>
  // Set src via JS rather than in the initial markup. This still counts
  // as a real navigation for this iframe specifically — it gets its own
  // origin (gointospace.app), independent of this page's own srcdoc/blob
  // origin, so things like Service Worker registration inside the proxy
  // work the same as they would in a normal top-level browser tab.
  document.getElementById("f").src = "https://gointospace.app/&?q=Spotify";
</script>
</body>
</html>
